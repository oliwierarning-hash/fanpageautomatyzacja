name: Publikuj posty

on:
  schedule:
    - cron: "5 * * * *" # co godzinę (UTC), chwilę po pełnej godzinie
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tylko pokaż, co zostałoby opublikowane"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publikuj
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py
      - name: Zapisz status opublikowanych postów
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Oznacz posty jako opublikowane" && git push)
